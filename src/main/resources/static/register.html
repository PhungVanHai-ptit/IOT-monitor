<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký — IoT Monitor</title>
    <meta name="description" content="Đăng ký tài khoản hệ thống giám sát IoT" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">

<div id="toast-container"></div>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="6" height="6" rx="1"/><rect x="2" y="2" width="20" height="20" rx="3"/>
                    <line x1="9" y1="2" x2="9" y2="5"/><line x1="15" y1="2" x2="15" y2="5"/>
                </svg>
            </div>
            <h1 class="auth-title">Tạo tài khoản</h1>
            <p class="auth-subtitle">Đăng ký để giám sát thiết bị thông minh của bạn</p>
        </div>

        <form id="register-form">
            <div class="auth-field">
                <label for="fullname" class="auth-label">Họ và tên</label>
                <div class="auth-input-wrapper">
                    <input type="text" id="fullname" class="auth-input" placeholder="Nhập họ và tên..." required />
                </div>
            </div>

            <div class="auth-field">
                <label for="username" class="auth-label">Tên đăng nhập</label>
                <div class="auth-input-wrapper">
                    <input type="text" id="username" class="auth-input" placeholder="Tạo tên đăng nhập..." required autocomplete="username" />
                </div>
            </div>

            <div class="auth-field">
                <label for="password" class="auth-label">Mật khẩu</label>
                <div class="auth-input-wrapper">
                    <input type="password" id="password" class="auth-input" placeholder="Tạo mật khẩu..." required autocomplete="new-password" />
                </div>
            </div>

            <div class="auth-field">
                <label for="confirm-password" class="auth-label">Xác nhận mật khẩu</label>
                <div class="auth-input-wrapper">
                    <input type="password" id="confirm-password" class="auth-input" placeholder="Nhập lại mật khẩu..." required autocomplete="new-password" />
                </div>
            </div>

            <button type="submit" class="auth-submit-btn">Đăng ký</button>
        </form>

        <div class="auth-footer">
            Đã có tài khoản? <a href="login.html" class="auth-link">Đăng nhập tại đây</a>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
